name: CI/CD to EC2

on:
  push:
    branches: ["test"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend-app ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend-app

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Instalar docker-compose si no existe
            if ! command -v docker-compose &> /dev/null
            then
              sudo apt update
              sudo apt install -y docker-compose
            fi

            mkdir -p ~/PR2

            # Eliminar contenedores, imágenes y volúmenes viejos
            sudo docker-compose -f ~/PR2/docker-compose.yml down --rmi all --volumes --remove-orphans || true

            # Crear docker-compose.yml actualizado con valores inyectados
            cat > ~/PR2/docker-compose.yml <<EOF
            version: '3.8'
            services:
              backend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest
                container_name: backend_app
                ports:
                  - "8080:8080"
                environment:
                  - DB_HOST=${{ secrets.DB_HOST }}
                  - DB_USER=${{ secrets.DB_USER }}
                  - DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                  - DB_NAME=${{ secrets.DB_NAME }}
                  - DB_PORT=${{ secrets.DB_PORT }}
              frontend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:latest
                container_name: frontend_app
                ports:
                  - "80:80"
            EOF

            cd ~/PR2
            sudo docker-compose pull
            sudo docker-compose up -d



