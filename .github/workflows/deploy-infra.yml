name: Deploy Infraestructura AWS (PR4)

on:
  push:
    branches:
      - test
    paths:
      - 'infra/**'

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configurar AWS CLI
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set aws_session_token ${{ secrets.AWS_SESSION_TOKEN }}
          aws configure set default.region us-east-1

      # ================================
      # LIMPIEZA COMPLETA DE AWS
      # ================================
      - name: Limpiar infraestructura existente en AWS
        run: |
          echo "Eliminando instancias RDS existentes..."
          DBS=$(aws rds describe-db-instances --query "DBInstances[].DBInstanceIdentifier" --output text)
          for DB in $DBS; do
            echo "Eliminando DB: $DB"
            aws rds delete-db-instance --db-instance-identifier $DB --skip-final-snapshot || true
          done

          for DB in $DBS; do
            echo "Esperando que DB $DB se elimine completamente..."
            aws rds wait db-instance-deleted --db-instance-identifier $DB || true
          done

          echo "Eliminando DB Subnet Groups..."
          DB_SUBNETS=$(aws rds describe-db-subnet-groups --query "DBSubnetGroups[].DBSubnetGroupName" --output text)
          for DBSUB in $DB_SUBNETS; do
            echo "Eliminando DB Subnet Group: $DBSUB"
            aws rds delete-db-subnet-group --db-subnet-group-name $DBSUB || true
          done

          echo "Eliminando Key Pairs duplicadas..."
          KEYS=$(aws ec2 describe-key-pairs --query "KeyPairs[].KeyName" --output text)
          for KEY in $KEYS; do
            if [[ "$KEY" == "pr4-key" ]]; then
              echo "Eliminando KeyPair: $KEY"
              aws ec2 delete-key-pair --key-name $KEY || true
            fi
          done

          echo "Eliminando TODAS las VPCs..."
          VPCS=$(aws ec2 describe-vpcs --query "Vpcs[].VpcId" --output text)
          for VPC in $VPCS; do
            echo "Limpiando VPC: $VPC"

            SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$VPC" --query "Subnets[].SubnetId" --output text)
            for SUB in $SUBNETS; do
              aws ec2 delete-subnet --subnet-id $SUB || true
            done

            IGWS=$(aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=$VPC" --query "InternetGateways[].InternetGatewayId" --output text)
            for GW in $IGWS; do
              aws ec2 detach-internet-gateway --internet-gateway-id $GW --vpc-id $VPC || true
              aws ec2 delete-internet-gateway --internet-gateway-id $GW || true
            done

            RTBS=$(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=$VPC" --query "RouteTables[].RouteTableId" --output text)
            for RTB in $RTBS; do
              MAIN=$(aws ec2 describe-route-tables --route-table-ids $RTB --query "RouteTables[].Associations[].Main" --output text)
              if [[ "$MAIN" != "True" ]]; then
                aws ec2 delete-route-table --route-table-id $RTB || true
              fi
            done

            SGS=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC" --query "SecurityGroups[?GroupName!='default'].GroupId" --output text)
            for SG in $SGS; do
              aws ec2 delete-security-group --group-id $SG || true
            done

            aws ec2 delete-vpc --vpc-id $VPC || true
          done

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.12.2

      - name: Inicializar y aplicar Terraform
        run: |
          terraform -chdir=infra init
          terraform -chdir=infra apply -auto-approve

      - name: Exportar outputs de Terraform
        run: |
          terraform -chdir=infra output -raw ec2_public_ip > ec2_ip.txt
          terraform -chdir=infra output -raw rds_endpoint > rds_endpoint.txt

      - name: Subir outputs como artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: |
            ec2_ip.txt
            rds_endpoint.txt

      - name: Subir clave SSH como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-key
          path: infra/pr4-key.pem



 