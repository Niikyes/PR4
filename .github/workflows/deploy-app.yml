name: CI/CD Aplicación AWS (PR4)

on:
  workflow_dispatch: # Se puede ejecutar manualmente
  workflow_run:
    workflows: ["Deploy Infraestructura AWS (PR4)"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }} # ✅ Solo si deploy-infra fue exitoso
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # Descargar artifacts del último run exitoso
      - name: Descargar artifacts de Terraform y SSH Key
        run: |
          LATEST_RUN_ID=$(gh run list --workflow "Deploy Infraestructura AWS (PR4)" --branch test --json databaseId --jq '.[0].databaseId')
          echo "Último run ID de infraestructura: $LATEST_RUN_ID"
          gh run download $LATEST_RUN_ID --name terraform-outputs --dir ./outputs
          gh run download $LATEST_RUN_ID --name ssh-key --dir ./infra
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Cargar outputs
      - name: Cargar outputs
        run: |
          echo "EC2_IP=$(cat ./outputs/ec2_ip.txt)" >> $GITHUB_ENV
          echo "DB_HOST=$(cat ./outputs/rds_endpoint.txt)" >> $GITHUB_ENV

      # Login DockerHub
      - name: Log in a DockerHub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # Construir imágenes
      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend-app ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend-app

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app

      # Preparar clave SSH
      - name: Preparar clave SSH
        run: |
          cp infra/pr4-key.pem ./pr4-key.pem
          chmod 600 ./pr4-key.pem

      # Desplegar en EC2
      - name: Deploy en EC2 con Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no -i ./pr4-key.pem ubuntu@${{ env.EC2_IP }} << EOF
            mkdir -p ~/PR4
            cat > ~/PR4/docker-compose.yml <<EOL
            version: '3.8'
            services:
              backend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest
                container_name: backend_app
                ports:
                  - "8080:8080"
                environment:
                  - DB_HOST=${{ env.DB_HOST }}
                  - DB_USER=postgres
                  - DB_PASSWORD=12345678
                  - DB_NAME=test
                  - DB_PORT=5432
              frontend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:latest
                container_name: frontend_app
                ports:
                  - "80:80"
            EOL
            cd ~/PR4
            sudo docker-compose down --remove-orphans || true
            sudo docker-compose pull
            sudo docker-compose up -d --build
          EOF













