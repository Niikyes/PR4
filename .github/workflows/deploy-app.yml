name: CI/CD Aplicación AWS (PR4)

on:
  push:
    branches:
      - test
    paths-ignore:
      - 'infra/**'          # Ignora commits que solo tocan infra
  workflow_run:
    workflows: ["Deploy Infraestructura AWS (PR4)"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # 📥 Descargar outputs solo si vienen del workflow de infra
      - name: Descargar outputs de Terraform (si existen)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v3
        with:
          name: terraform-outputs
          path: ./outputs

      # 📂 Si hay artifact, cargarlo; si no, usar el último artifact persistido
      - name: Cargar outputs en variables de entorno
        run: |
          if [ -f "./outputs/ec2_ip.txt" ]; then
            echo "EC2_IP=$(cat ./outputs/ec2_ip.txt)" >> $GITHUB_ENV
            echo "DB_HOST=$(cat ./outputs/db_host.txt)" >> $GITHUB_ENV
          else
            echo "Usando valores anteriores..."
            echo "EC2_IP=${{ secrets.EC2_IP }}" >> $GITHUB_ENV
            echo "DB_HOST=${{ secrets.DB_HOST }}" >> $GITHUB_ENV
          fi

      - name: Configurar AWS CLI
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set aws_session_token ${{ secrets.AWS_SESSION_TOKEN }}
          aws configure set default.region us-east-1

      - name: Actualizar API URL en frontend
        run: |
          API_URL="http://${{ env.EC2_IP }}:8080"
          sed -i "s|http://[0-9\.]*:8080|$API_URL|g" ./frontend/index.html
          sed -i "s|http://[0-9\.]*:8080|$API_URL|g" ./frontend/joke.html

      - name: Log in a DockerHub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend-app ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend-app

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app

      - name: Preparar clave SSH
        run: |
          cp infra/pr4-key.pem ./pr4-key.pem
          chmod 600 ./pr4-key.pem

      - name: Deploy en EC2 con Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no -i ./pr4-key.pem ubuntu@${{ env.EC2_IP }} << EOF
            mkdir -p ~/PR4

            cat > ~/PR4/docker-compose.yml <<EOL
            version: '3.8'
            services:
              backend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest
                container_name: backend_app
                ports:
                  - "8080:8080"
                environment:
                  - DB_HOST=${{ env.DB_HOST }}
                  - DB_USER=postgres
                  - DB_PASSWORD=12345678
                  - DB_NAME=test
                  - DB_PORT=5432
              frontend:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:latest
                container_name: frontend_app
                ports:
                  - "80:80"
            EOL

            cd ~/PR4
            sudo docker-compose down --remove-orphans || true
            sudo docker-compose pull
            sudo docker-compose up -d --build
          EOF





